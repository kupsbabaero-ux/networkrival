name: Update Philippine TV EPG

on:
  schedule:
    - cron: "15 16 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/update-epg.yml"

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/generate_epg.py
      - id: verify
        run: |
          if git diff --quiet epg/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.verify.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg/ph-tv-epg.xml epg/ph-tv-epg.xml.gz
          git commit -m "chore(epg): auto-update programme times $(date -u +%Y-%m-%d)"
          git push
